name: Publish Image

# Builds the Docker image and pushes it to Amazon ECR after "Maven Tests"
# passes on main, so only tested commits are published. Can also be run
# manually from the Actions tab.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION      e.g. us-east-1
#   AWS_ROLE_ARN    IAM role GitHub assumes via OIDC, allowed to push to the repository
#   ECR_REPOSITORY  ECR repository name, e.g. horse-inventory-service

on:
  workflow_run:
    workflows: [Maven Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.COMMIT_SHA }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          tags: |
            type=raw,value=${{ env.COMMIT_SHA }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
