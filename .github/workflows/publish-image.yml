name: Publish Image

# Builds the Docker image and pushes it to Amazon ECR when a GitHub release is
# published, or when called by the Create Release workflow. Drafts and
# prereleases do not publish an image. Release tags must be vMAJOR.MINOR.PATCH.
#
# The release commit must be on main and have a successful "Maven Tests" run.
# A release tag already in ECR is never rebuilt, and "latest" only moves for
# the repository's latest release.
#
# Required repository variables (Settings > Secrets and variables > Actions > Variables):
#   AWS_REGION      e.g. us-east-1
#   AWS_ROLE_ARN    IAM role GitHub assumes via OIDC, allowed to push to the repository
#                   and to call ecr:DescribeImages on it
#   ECR_REPOSITORY  ECR repository name, e.g. horse-inventory-service

on:
  release:
    types: [released]
  workflow_call:
    inputs:
      tag:
        description: Release tag to publish, as vMAJOR.MINOR.PATCH
        required: true
        type: string
      commit:
        description: Full SHA of the release commit
        required: true
        type: string

# A literal group: in a called workflow, github.workflow is the caller's name.
concurrency:
  group: publish-image
  cancel-in-progress: false

permissions:
  actions: read # look up the Maven Tests run for the release commit
  contents: read
  id-token: write # OIDC token for AWS

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      COMMIT_SHA: ${{ inputs.commit || github.sha }}
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Verify release tag format
        run: |
          number='(0|[1-9][0-9]*)'
          if ! [[ "$RELEASE_TAG" =~ ^v$number\.$number\.$number$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH, for example v1.2.0."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: ${{ env.COMMIT_SHA }}
          fetch-depth: 0 # full history for the ancestry check

      # Use the full ref so a tag named "main" cannot satisfy the check.
      - name: Verify commit is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" refs/remotes/origin/main; then
            echo "::error::$COMMIT_SHA is not on main, refusing to publish."
            exit 1
          fi

      # The Docker build skips tests, so the release relies on this check.
      - name: Verify Maven Tests passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --workflow maven-tests.yml --commit "$COMMIT_SHA" \
            --status success --limit 1 --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "::error::$COMMIT_SHA has no successful Maven Tests run, refusing to publish."
            exit 1
          fi

      - name: Check whether this is the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          if [ "$current" = "$RELEASE_TAG" ]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Any error other than "not found" fails the job rather than risk an overwrite.
      - name: Check for existing image
        id: published
        env:
          ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          if output=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids "imageTag=$RELEASE_TAG" 2>&1); then
            echo "::notice::$RELEASE_TAG is already published, skipping."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q ImageNotFoundException <<< "$output"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            echo "$output" >&2
            exit 1
          fi

      - name: Log in to Amazon ECR
        id: ecr
        if: steps.published.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - if: steps.published.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Image tags
        id: meta
        if: steps.published.outputs.exists != 'true'
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ env.RELEASE_TAG }}
            type=raw,value=latest,enable=${{ steps.release.outputs.latest }}

      - name: Build and push
        if: steps.published.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
